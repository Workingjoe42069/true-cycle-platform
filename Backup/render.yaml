databases:
  - name: true-cycle-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: true-cycle-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: true-cycle-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://REPLACE-WITH-YOUR-FRONTEND-URL
